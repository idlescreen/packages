[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
name = "idlescreen-packages"
version = "4.0.5"
edition = "2024"
description = "Repository maintenance tools for IdleScreen package distribution"
license = "Apache-2.0"

[lib]
name = "idlescreen_packages"
path = "src/lib.rs"

[[bin]]
name = "update"
path = "src/update.rs"

[[bin]]
name = "prune"
path = "src/prune.rs"

[[bin]]
name = "sign"
path = "src/sign.rs"

[[bin]]
name = "install"
path = "src/install_bin/main.rs"

[dependencies]
semver = "1.0"

[dev-dependencies]
proptest = "1.6"
