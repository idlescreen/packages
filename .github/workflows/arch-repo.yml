name: Build Arch Repository

# The site teaches an Arch install path, and until this workflow existed
# nothing ever produced the pacman database it needed: `arch/idlescreen.db`
# was a 404, so `install.sh` on Arch died at "Could not download the signed
# pacman sync database". The RPM/DEB channel was published by
# Import Product Release; Arch had no equivalent.
#
# Self-contained on purpose — it does not touch the RPM pool or its indexes,
# so a failure here cannot corrupt a channel that already works.

on:
  push:
    branches: [ master ]
    paths:
      - arch/**
      - .github/workflows/arch-repo.yml
  workflow_dispatch:
  # repository_dispatch only holds one pending run, so a burst of dispatches
  # drops all but one. The sweep converges to the PKGBUILD's pinned refs
  # regardless of which trigger fired — a dropped dispatch self-heals here.
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: "arch-repo"
  cancel-in-progress: true

jobs:
  build:
    name: makepkg + sign
    # Arch tooling in an Arch image: no cross-distro guessing about makepkg,
    # repo-add, or the .pkg.tar.zst format.
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Checkout packages repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh package databases
        run: pacman -Sy --noconfirm --disable-download-timeout

      - name: Install build dependencies
        run: |
          # Build tooling plus the libraries the PKGBUILD declares in
          # `depends`, so makepkg's own dep check passes. Note libxkbcommon,
          # not "xkbcommon" — that name does not exist and fails the whole
          # install before a package is ever fetched.
          pacman -S --noconfirm --needed --disable-download-timeout \
            base-devel git rustup cmake \
            dbus wayland openssl systemd-libs \
            libxcb libxkbcommon wayland-protocols vulkan-headers \
            fontconfig freetype2 seatd
          sed -i 's/-flto=auto//g' /etc/makepkg.conf

      - name: Prepare Rust toolchain and a non-root build user
        run: |
          # Pin the toolchain the project declares, rather than whatever
          # `stable` happens to be today. The file lives in the runtime repo,
          # which is only fetched later by makepkg, so read it from a shallow
          # clone up front.
          git clone --depth 1 https://github.com/idlescreen/runtime /tmp/rt
          TOOLCHAIN="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' /tmp/rt/rust-toolchain.toml | head -n1)"
          echo "project toolchain: ${TOOLCHAIN:-<unpinned>}"
          if [ -n "$TOOLCHAIN" ]; then
            rustup toolchain install "$TOOLCHAIN" --profile minimal
            rustup default "$TOOLCHAIN"
          else
            rustup default stable
          fi
          rustc --version

          # makepkg hard-refuses to run as root, and container jobs are root.
          useradd -m -s /bin/bash builder
          mkdir -p /opt/rust/.cargo /opt/rust/.rustup
          cp -a /root/.rustup /root/.cargo /opt/rust/ 2>/dev/null || true

          # Cargo reads $CARGO_HOME/config.toml itself. makepkg runs build()
          # in a controlled environment, and RUSTFLAGS set in the parent has
          # not been reaching cargo — every attempt to force the linker by
          # environment variable still ended up on rust-lld. Put it where
          # cargo looks instead.
          cat >/opt/rust/.cargo/config.toml <<'CARGO_EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "gcc"
          rustflags = [
            "-C", "target-cpu=x86-64-v3",
            "-C", "link-arg=-fuse-ld=bfd",
          ]
          CARGO_EOF

          chmod -R a+rX /opt/rust
          chown -R builder:builder "$GITHUB_WORKSPACE" /opt/rust
          echo "cargo config:"; cat /opt/rust/.cargo/config.toml

      - name: Build packages
        # The build script goes in a file rather than inline in `su -c`.
        # Nesting shell quoting inside a single-quoted su argument is fragile
        # in a way that is very hard to debug from CI output.
        run: |
          cat >/tmp/build.sh <<'BUILD_EOF'
          #!/bin/bash
          set -euo pipefail
          export CFLAGS="${CFLAGS:-}"
          export CXXFLAGS="${CXXFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"
          export CFLAGS="${CFLAGS//-flto=auto/}"
          export CXXFLAGS="${CXXFLAGS//-flto=auto/}"
          export LDFLAGS="${LDFLAGS//-flto=auto/}"
          export RUSTUP_HOME=/opt/rust/.rustup
          export CARGO_HOME=/opt/rust/.cargo
          export PATH="$CARGO_HOME/bin:$PATH"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="gcc"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="-C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=bfd"

          # Link with the system C compiler driver. Arch enables rust-lld by
          # default and mimalloc's C symbols do not resolve under it here:
          # "undefined symbol: mi_realloc_aligned" / "mi_zalloc_aligned".
          # Not `-fuse-ld=bfd` — that is a link-arg handed to whichever driver
          # rust already picked. Not `-C linker=bfd` — there is no binary
          # called `bfd`. `cc` is present from base-devel and gcc does not
          # default to lld, so this matches the RPM/DEB channels.
          # Arch ships /usr/bin/ld as ld.lld, so choosing cc as the driver is
          # not enough on its own — cc still lands on lld. Now that cc is the
          # driver, -fuse-ld=bfd is meaningful and pins the actual linker.
          # Linker selection lives in $CARGO_HOME/config.toml (see setup).
          # Arch ships /usr/bin/ld as ld.lld, so cc alone still lands on lld;
          # -fuse-ld=bfd is what actually pins GNU ld.

          # Prove which linker we actually got, rather than inferring it from
          # a link error twenty minutes later.
          echo "cc:     $(cc --version | head -n1)"
          echo "ld:     $(ld --version | head -n1)"
          echo "ld.bfd: $(ld.bfd --version | head -n1)"

          cd "$1"
          echo "building in $PWD"
          ls -1
          makepkg --cleanbuild --clean --noconfirm --nodeps \
            --skippgpcheck --skipchecksums
          BUILD_EOF
          chmod +x /tmp/build.sh
          mkdir -p /tmp/site
          chown builder:builder /tmp/build.sh
          su builder -c "/tmp/build.sh \"$GITHUB_WORKSPACE/arch/idlescreen\""
          echo "=== produced ==="
          ls -la "$GITHUB_WORKSPACE/arch/idlescreen"/*.pkg.tar.zst || true

      - name: Verify the expected split packages were produced
        working-directory: arch/idlescreen
        run: |
          set -uo pipefail
          produced="$(ls -1 ./*.pkg.tar.zst 2>/dev/null | wc -l)"
          echo "produced $produced package(s)"
          ls -la ./*.pkg.tar.zst || true
          # Five splits: idle-daemon, idle-cli, idle-tui, idle-savers, idlescreen
          if [ "$produced" -lt 5 ]; then
            echo "ERROR: expected at least 5 split packages, got $produced"
            exit 1
          fi

      - name: Upload packages and build log
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: |
            arch/idlescreen/*.pkg.tar.zst
          retention-days: 30

  publish:
    name: sign + publish database
    runs-on: ubuntu-latest
    needs: build
    container: archlinux:base
    steps:
      - name: Refresh package databases and install tooling
        run: |
          pacman -Sy --noconfirm --disable-download-timeout
          pacman -S --noconfirm --needed --disable-download-timeout gnupg git

      - name: Checkout packages repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: arch-packages
          path: arch/idlescreen

      - name: Require GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: secret GPG_PRIVATE_KEY is required (refuse unsigned publish)"
            exit 1
          fi

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" > /tmp/gpg-passphrase.txt
            chmod 600 /tmp/gpg-passphrase.txt
            echo '#!/bin/bash' > /tmp/gpg-wrapper
            echo 'exec gpg --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase.txt "$@"' >> /tmp/gpg-wrapper
            chmod +x /tmp/gpg-wrapper
            echo "$GPG_PRIVATE_KEY" | /tmp/gpg-wrapper --batch --yes --import
          else
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          fi

          gpg --list-secret-keys --keyid-format=long

      - name: Build and sign the sync database
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd arch/idlescreen
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            export GNUPGHOME="${HOME}/.gnupg"
            if [ -x /tmp/gpg-wrapper ]; then
              ln -sf /tmp/gpg-wrapper /tmp/gpg
              export PATH="/tmp:$PATH"
            fi
            KEYID="$(gpg --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                       --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
            repo-add --include-sigs --sign --key "$KEYID" idlescreen.db.tar.gz ./*.pkg.tar.zst
            gpg --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --yes --detach-sign --armor idlescreen.db.tar.gz
          else
            KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
            repo-add --include-sigs --sign --key "$KEYID" idlescreen.db.tar.gz ./*.pkg.tar.zst
            gpg --yes --detach-sign idlescreen.db.tar.gz
          fi
          ls -la idlescreen.db*

      - name: Commit packages and database
        # Commit rather than deploy from here on purpose.
        #
        # Deploy GitHub Pages uploads the whole repository tree (`path: '.'`)
        # and is triggered by any push to master. A second workflow deploying
        # its own artifact directory would replace the entire site and drop
        # the RPM pool and APT metadata that already work.
        #
        # Committing matches how rpm/pool is already published: the packages
        # live in the repo and the normal Pages job serves them.
        run: |
          set -euo pipefail
          mkdir -p arch
          cp -a arch/idlescreen/idlescreen.db* arch/ 2>/dev/null || true
          cp -a arch/idlescreen/idlescreen.files* arch/ 2>/dev/null || true
          cp -a arch/idlescreen/*.pkg.tar.zst* arch/ 2>/dev/null || true
          rm -rf arch/idlescreen/src arch/idlescreen/pkg arch/idlescreen/*.pkg.tar.zst*
          ls -la arch/

          git config --global --add safe.directory '*'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arch/
          if git diff --cached --quiet; then
            echo "arch/ unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "build: publish Arch pacman repository"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:master; then exit 0; fi
            echo "push attempt $i failed; rebasing and retrying"
            sleep 5
            git pull --rebase origin master || true
          done
          echo "ERROR: could not push arch/ after 5 attempts"
          exit 1
