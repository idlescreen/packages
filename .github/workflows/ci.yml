name: Shell-script CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: shellcheck installer scripts
      run: |
        shellcheck install.sh
        shellcheck install_core.sh
        shellcheck install_audit.sh
        shellcheck post_install.sh
        shellcheck ui.sh
        shellcheck detect.sh
        shellcheck repo.sh

    - name: Run audit JSON-escape test (F-202 regression)
      run: bash tests/test_audit_json_escape.sh

    - name: Run install.sh smoke test (mock package manager)
      run: bash tests/test_install_smoke.sh

    - name: Run --verify-self edge cases
      run: bash tests/test_verify_self_edge.sh

    - name: bash -n syntax check
      run: |
        for f in install.sh install_core.sh install_audit.sh post_install.sh; do
          bash -n "$f"
        done