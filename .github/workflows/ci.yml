name: Package Channel CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oo-gates:
    name: Build from source and run the openOODA gates
    runs-on: ubuntu-latest
    # The full ladder builds the tools three times (test, det) with the
    # LLVM backend; on a hosted runner that is well past 15 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the openOODA toolchain
        env:
          # The toolchain repos are private in the openOODA-core org, so the
          # default GITHUB_TOKEN cannot read them. The installer pulls the
          # std tree with the gh CLI, so a PAT with repo scope across that
          # org is required here.
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — cannot install the openOODA toolchain"
            exit 1
          fi
          # The toolchain is a compiler plus a runtime archive, and the
          # compiler needs that archive to link anything — the runtime
          # cannot be rebuilt from source without one. The installer is the
          # supported way to get both: it verifies every asset against the
          # hub's SHA256SUMS before installing it.
          curl -fsSL https://openooda.org/install.sh | bash -s -- --yes
          test -x "$HOME/.openooda/bin/oodac"
          test -f "$HOME/.openooda/bin/liboodar.a"
          echo "OODA_HOME=$HOME/.openooda" >> "$GITHUB_ENV"

      - name: Stage the std tree and the build tree under /tmp
        run: |
          # oodar's oo_child_filter_env() scrubs a child process's environment
          # and replaces the inherited OODA_FS_READDIR/OODA_FS_WRITEDIR with a
          # hardcoded scope that covers /tmp. `oodac build` spawns `oodac
          # check` as a child, so the std tree and the workspace have to sit
          # under /tmp for that child to read them.
          #
          # The std tree is staged under the name `oostd`, as a sibling of the
          # project: the compiler resolves oostd/... imports through
          # OODA_STD_DIR, and the Makefile points it at that sibling.
          mkdir -p /tmp/ooda-toolchain
          cp -a "$HOME/.openooda/oostd" /tmp/ooda-toolchain/oostd
          mkdir -p /tmp/ooda-toolchain/packages
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" /tmp/ooda-toolchain/packages/
          echo "OODA_STD_DIR=/tmp/ooda-toolchain/oostd" >> "$GITHUB_ENV"
          echo "WORKDIR=/tmp/ooda-toolchain/packages" >> "$GITHUB_ENV"

      - name: Build from source
        working-directory: ${{ env.WORKDIR }}
        run: make build

      - name: Verify (page rules, typecheck, vocabulary)
        working-directory: ${{ env.WORKDIR }}
        run: make verify

      - name: Test suite
        working-directory: ${{ env.WORKDIR }}
        run: make test

      - name: Deterministic build
        working-directory: ${{ env.WORKDIR }}
        run: make det

  ooda-checks:
    name: Native openOODA (.oo) & Shell Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Verify native openOODA (.oo) tools & self-test
      run: |
        chmod +x bin/packages bin/prune bin/sign bin/update bin/install bin/sync-hashes
        ./bin/packages --self-test
        ./bin/packages prune --dry-run
        ./bin/packages install --dry-run
        ./bin/packages sync-hashes --check
        # The multi-call persona is selected from the invocation name. It
        # resolves from /proc/self/cmdline, which the jail read scope now
        # covers, so the aliases must work here and are asserted, not skipped.
        ./bin/prune --dry-run
        ./bin/install --dry-run
        ./bin/sync-hashes --check
        echo "PASS: multi-call alias dispatch"

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: shellcheck installer scripts
      run: |
        shellcheck install.sh
        shellcheck install_core.sh
        shellcheck install_audit.sh
        shellcheck post_install.sh
        shellcheck ui.sh
        shellcheck detect.sh
        shellcheck repo.sh
        shellcheck uninstall.sh
        shellcheck scripts/sync_installer_checksums.sh
        shellcheck tests/test_install_smoke.sh
        shellcheck tests/test_verify_self_edge.sh
        shellcheck tests/test_studio_installer.sh
        shellcheck arch/idlescreen/omarchy-launch-screensaver
        shellcheck -s bash arch/idlescreen/PKGBUILD
        shellcheck arch/idlescreen/idlescreen.install
        shellcheck -x install-studio.sh
        for f in install-studio-lib/*.sh; do
          shellcheck "$f"
        done

    - name: Run audit JSON-escape test (F-202 regression)
      run: bash tests/test_audit_json_escape.sh

    - name: Run install.sh smoke test (mock package manager)
      run: bash tests/test_install_smoke.sh

    - name: Published site teaches only the verified install path
      run: |
        if grep -nE 'tee +/etc/apt/keyrings|yum\.repos\.d/idlescreen\.repo|sources\.list\.d/idlescreen\.list' index.html; then
          echo "::error::index.html hand-places a trust anchor — point users at install.sh instead"
          exit 1
        fi
        grep -q 'install.sh --verify' index.html \
          || { echo "::error::index.html does not teach the --verify path"; exit 1; }
        echo "index.html points at the fingerprint-verifying installer only"

    - name: install-studio.sh installs only published packages
      run: |
        bash -n install-studio.sh
        IDLESCREEN_REPO_BASE="file://$(pwd)" sh -c '
          set -eu
          . ./install-studio-lib/00-color.sh
          . ./install-studio-lib/10-preflight.sh
          preflight_packages
        '

    - name: Run studio installer contract test
      run: bash tests/test_studio_installer.sh

    - name: Run --verify-self edge cases
      run: bash tests/test_verify_self_edge.sh

    - name: Verify installer module checksums are synchronized
      run: bash scripts/sync_installer_checksums.sh --check

    - name: bash -n syntax check
      run: |
        for f in install.sh install_core.sh install_audit.sh post_install.sh ui.sh detect.sh repo.sh uninstall.sh scripts/sync_installer_checksums.sh; do
          bash -n "$f"
        done
