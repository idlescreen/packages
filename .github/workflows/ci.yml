name: Shell-script CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    # A hung installer step or a wedged smoke test must fail the build,
    # not burn a runner for the 6-hour default. See runtime's
    # `apply_commands_drains_channel_until_empty` incident.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Validate page-score.json
      run: qa/page_score_check.sh

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: shellcheck installer scripts
      run: |
        shellcheck install.sh
        shellcheck install_core.sh
        shellcheck install_audit.sh
        shellcheck post_install.sh
        shellcheck ui.sh
        shellcheck detect.sh
        shellcheck repo.sh
        shellcheck uninstall.sh
        shellcheck arch/idlescreen/omarchy-launch-screensaver
        shellcheck -s bash arch/idlescreen/PKGBUILD
        shellcheck arch/idlescreen/idlescreen.install
        # The install-studio driver dot-sources a chain
        # of helpers under install-studio-lib/. Those are linted
        # separately — they are not exec'd at install time, so a
        # shellcheck failure in a sibling still has to surface here.
        #
        # `-x` is required on the driver: without it shellcheck refuses
        # to follow the `source` lines and reports SC1091 "not following"
        # for every helper, which fails the build without ever looking at
        # a helper's body.
        shellcheck -x install-studio.sh
        for f in install-studio-lib/*.sh; do
          shellcheck "$f"
        done
    - name: Run audit JSON-escape test (F-202 regression)
      run: bash tests/test_audit_json_escape.sh

    - name: Run install.sh smoke test (mock package manager)
      run: bash tests/test_install_smoke.sh

    - name: Published site teaches only the verified install path
      # The page is the primary human path. It once piped a fetched keyring
      # into /etc/apt/keyrings with no fingerprint check and curl'd a remote
      # .repo into /etc/yum.repos.d — precisely what repo.sh refuses to do
      # because a fetched repo file can swap both the trust anchor and the
      # baseurl. Only a warning mention is allowed now.
      run: |
        if grep -nE 'tee +/etc/apt/keyrings|yum\.repos\.d/idlescreen\.repo|sources\.list\.d/idlescreen\.list' index.html; then
          echo "::error::index.html hand-places a trust anchor — point users at install.sh instead"
          exit 1
        fi
        grep -q 'install.sh --verify' index.html \
          || { echo "::error::index.html does not teach the --verify path"; exit 1; }
        echo "index.html points at the fingerprint-verifying installer only"

    - name: install-studio.sh installs only published packages
      # `idlescreen-studio` is not in either index; the old script imported the
      # key and wrote /etc sources as root and then exited 1 every time.
      run: |
        bash -n install-studio.sh
        # STUDIO_PKGS moved into install-studio-lib/00-color.sh when the
        # driver was split into libraries. Read it from wherever it is
        # actually defined, so this check keeps working across the split
        # instead of failing on a file that no longer holds it.
        _pkgs=$(grep -h '^STUDIO_PKGS=' install-studio.sh install-studio-lib/*.sh | head -1 | cut -d'"' -f2)
        if [ -z "$_pkgs" ]; then
          echo "::error::could not read STUDIO_PKGS from install-studio.sh"
          exit 1
        fi
        for pkg in $_pkgs; do
          if ! grep -q "^Package: ${pkg}$" apt/dists/stable/main/binary-amd64/Packages; then
            echo "::error::install-studio.sh requests an unpublished package: ${pkg}"
            exit 1
          fi
        done
        echo "every requested studio package is published"

    - name: Run --verify-self edge cases
      run: bash tests/test_verify_self_edge.sh

    - name: bash -n syntax check
      run: |
        for f in install.sh install_core.sh install_audit.sh post_install.sh; do
          bash -n "$f"
        done